<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN 属性查看器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-main">
      <div class="toolbar-file">
        <label class="btn primary" title="打开一个 BPMN 文件（也可以直接拖进页面）">
          打开 BPMN<input id="file-input" type="file" accept=".bpmn,.xml" hidden>
        </label>
        <span id="file-name" class="file-name">未打开文件</span>
      </div>
      <div class="toolbar-filter" role="group" aria-label="筛选条件">
        <label class="field">筛选类别
          <select id="attr-select" disabled></select>
        </label>
        <button id="clear-btn" class="btn" type="button" disabled>清除筛选</button>
      </div>
      <div class="toolbar-lanes" role="group" aria-label="泳道视图设置">
        <label class="field">泳道分类
          <select id="lane-attr" disabled><option value="">原始布局</option></select>
        </label>
        <button id="lane-reset" class="btn" type="button" disabled>恢复原布局</button>
      </div>
      <div class="toolbar-actions" role="group" aria-label="视图和导出">
        <button id="theme-btn" class="btn" type="button" aria-pressed="false" title="切换到深色模式">深色模式</button>
        <button id="fit-btn" class="btn" type="button" disabled>适应窗口</button>
        <button id="export-svg-btn" class="btn" type="button" disabled title="下载完整矢量流程图，适合长流程图和放大查看">导出 SVG</button>
        <button id="export-png-btn" class="btn" type="button" disabled title="下载完整流程图的高清 PNG 图片">导出 PNG</button>
        <button id="print-btn" class="btn" type="button" disabled title="打印完整流程图，或另存为 PDF">打印 / PDF</button>
      </div>
    </div>
    <div id="chips" class="chips" aria-label="属性取值"></div>
  </header>
  <main id="stage" class="stage">
    <div id="canvas" class="canvas"></div>
    <svg id="lane-header" class="lane-frozen-header" role="group" aria-label="泳道标题与顺序调整" hidden></svg>
    <div id="scroll-x" class="diagram-scrollbar scroll-x" tabindex="0" role="region" aria-label="流程图横向滚动条">
      <div id="scroll-x-size" class="scroll-x-size"></div>
    </div>
    <div id="scroll-y" class="diagram-scrollbar scroll-y" tabindex="0" role="region" aria-label="流程图纵向滚动条">
      <div id="scroll-y-size" class="scroll-y-size"></div>
    </div>
    <div class="scroll-corner" aria-hidden="true"></div>
    <div id="message" class="message">打开或拖入一个 BPMN 文件</div>
    <aside id="card" class="card" hidden></aside>
    <div id="drop-hint" class="drop-hint" hidden>松开鼠标以打开文件</div>
    <div id="export-status" class="export-status" role="status" aria-live="polite" hidden></div>
  </main>
  <dialog id="print-dialog" class="print-dialog" aria-labelledby="print-title">
    <div class="print-header">
      <h2 id="print-title">打印 / 导出 PDF</h2>
      <button id="print-close" class="btn" type="button">关闭</button>
    </div>
    <p class="print-help">完整流程图将等比缩放到一页，保留当前筛选高亮。在系统打印窗口选择“另存为 PDF”，建议关闭页眉和页脚。长流程图建议使用工具栏「导出 SVG」或「导出 PNG」，以便放大查看。</p>
    <div class="print-settings">
      <label class="field">纸张
        <select id="print-paper"><option value="A4">A4</option><option value="A3">A3</option></select>
      </label>
      <label class="field">方向
        <select id="print-orientation">
          <option value="auto">自动</option>
          <option value="landscape">横向</option>
          <option value="portrait">纵向</option>
        </select>
      </label>
      <span id="print-status" role="status" aria-live="polite"></span>
    </div>
    <iframe id="print-preview" class="print-preview" title="完整流程图打印预览" sandbox="allow-same-origin allow-modals"></iframe>
    <div class="print-actions">
      <button id="print-confirm" class="btn primary" type="button" disabled>打印 / 保存 PDF</button>
    </div>
  </dialog>
  <script src="vendor/bpmn-js/bpmn-navigated-viewer.production.min.js"></script>
  <script src="properties.js"></script>
  <script src="print.js"></script>
  <script src="swimlanes.js"></script>
  <script src="app.js"></script>
</body>
</html>
